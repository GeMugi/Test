# Hyper Eternity · prévia da tela de ajustes com miuix (7.9.52)
# Arquivo único: o código da prévia vai compactado aqui dentro, no passo "Colocar a prévia".
# O GitHub compila e deixa o APK no ramo "apk" (e o log, se der erro, no ramo "log").
name: Compilar prévia miuix

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # Versão do miuix usada (commit de 15/10/2026). A prévia é compilada dentro do código dele.
  MIUIX_COMMIT: f36cbc904e81a94a779f87209326b460d2786b4e

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Baixar o miuix
        run: |
          git init -q miuix
          cd miuix
          git remote add origin https://github.com/compose-miuix-ui/miuix.git
          git fetch -q --depth 1 origin "$MIUIX_COMMIT"
          git checkout -q --detach FETCH_HEAD

